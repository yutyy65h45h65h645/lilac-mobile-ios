name: Lilac iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lilac IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools
        run: brew install ldid make

      - name: Build IPA and TrollStore TIPA
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"
          make -j$(sysctl -n hw.ncpu) package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin" TROLLSTORE_JIT_ENT=1
          mkdir out
          mv artifacts/dev.lilac.mobile-*-ios.ipa out/LilacMobile-Release.ipa
          mv artifacts/dev.lilac.mobile-*-ios-trollstore.tipa out/LilacMobile-Release-TrollStore.tipa
          shasum -a 256 out/*

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LilacMobile-Release.ipa
          path: out/LilacMobile-Release.ipa

      - name: Upload TrollStore TIPA
        uses: actions/upload-artifact@v4
        with:
          name: LilacMobile-Release-TrollStore.tipa
          path: out/LilacMobile-Release-TrollStore.tipa
